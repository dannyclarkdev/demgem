name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pint, Larastan, Pest on PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: demgem_test
          POSTGRES_USER: demgem
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demgem -d demgem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: demgem_test
      DB_USERNAME: demgem
      DB_PASSWORD: secret
      # Read by tests/Feature/DatabaseDriverTest.php. The point of this job is to run
      # the suite on PostgreSQL, so the suite fails loudly if it falls back to SQLite.
      CI_DB_DRIVER: pgsql

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, exif, gd, intl, pdo_pgsql, pgsql, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Analyse
        run: composer analyse

      - name: Migrate
        run: php artisan migrate --force

      - name: Test
        run: php artisan test --compact

  docker:
    name: The image builds, boots, and reaches Reverb
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Prepare the environment
        run: |
          cp .env.docker.example .env.docker
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env.docker
          # The live table's three strings. The app refuses to boot without them when
          # BROADCAST_CONNECTION is reverb, which is what the example ships.
          sed -i "s|^REVERB_APP_ID=.*|REVERB_APP_ID=$(openssl rand -hex 8)|" .env.docker
          sed -i "s|^REVERB_APP_KEY=.*|REVERB_APP_KEY=$(openssl rand -hex 16)|" .env.docker
          sed -i "s|^REVERB_APP_SECRET=.*|REVERB_APP_SECRET=$(openssl rand -hex 16)|" .env.docker

      # --wait holds until every healthcheck passes, so a container that comes up
      # broken fails here rather than on a self-hoster's box.
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Check the app answers
        run: curl --fail --silent --show-error http://localhost:8000/up

      - name: Check the login page renders
        run: curl --fail --silent --show-error http://localhost:8000/login | grep -q "demgem"

      # The live table needs a websocket server the browser can reach. --wait already
      # held for its healthcheck; this proves the published port answers too.
      - name: Check Reverb answers
        run: curl --fail --silent --show-error http://localhost:8080/up | grep -q "OK"

      - name: Show the logs when something failed
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
